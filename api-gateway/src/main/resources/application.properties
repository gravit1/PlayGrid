spring.application.name=api-gateway

server.port=8080

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Auth Service routes
spring.cloud.gateway.server.webflux.routes[0].id=auth-service-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=auth-service-users
spring.cloud.gateway.server.webflux.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/**


spring.cloud.gateway.server.webflux.routes[2].id=game-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://GAME-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/games/**

spring.cloud.gateway.server.webflux.routes[3].id=library-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://LIBRARY-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/library/**

spring.cloud.gateway.server.webflux.routes[4].id=wishlist-route
spring.cloud.gateway.server.webflux.routes[4].uri=lb://WISHLIST-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/wishlist/**

spring.cloud.gateway.server.webflux.routes[5].id=review-route
spring.cloud.gateway.server.webflux.routes[5].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/reviews/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

jwt.secret=playgrid-auth-service-secret-key-2024-should-be-32-bytes-min
